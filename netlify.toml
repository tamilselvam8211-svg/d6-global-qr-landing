# Netlify: static build, no functions, no environment secrets.
# The page is built into dist/qr/ and served at /qr/ (see vite.config.js),
# so it works both on this site's own domain and behind a /qr path proxy.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The site root and /qr both land on the page.
[[redirects]]
  from = "/"
  to = "/qr/"
  status = 301

[[redirects]]
  from = "/qr"
  to = "/qr/"
  status = 301

# Fingerprinted build assets never change -> cache for a year.
[[headers]]
  for = "/qr/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
